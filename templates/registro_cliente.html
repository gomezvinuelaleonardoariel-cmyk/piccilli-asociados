<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Nuevo Cliente - Piccilli & Asociados</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #3f3d38;
            --surface: #22262b;
            --surface-2: #2b3036;
            --border: #3d434a;
            --text: #ecebe6;
            --muted: #c2c2bc;
            --accent: #A88448;
            --accent-hover: #BA9455;
            --accent-text: #1c1a16;
            --radius: 8px;
        }
        body {
            background-color: var(--bg);   
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
        }
        h1, h2, h3, h4, h5, .serif {
            font-family: 'Cormorant Garamond', serif;
        }
        .navbar {
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
        }
        .card-custom {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        .btn-accent {
            background-color: var(--accent);
            color: var(--accent-text);
            font-weight: 600;
            border: none;
            transition: all 0.3s ease;
        }
        .btn-accent:hover {
            background-color: var(--accent-hover);
            color: var(--accent-text);
        }
        .form-control {
            background-color: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
        }
        .form-control:focus {
            background-color: var(--surface-2);
            border-color: var(--accent);
            color: var(--text);
            box-shadow: 0 0 0 0.25rem rgba(184, 152, 90, 0.25);
        }
    </style>
</head>
<body>

    <!-- Panel Superior -->
    <nav class="navbar navbar-expand-lg px-4 py-3">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-3 text-white" href="/panel-personal">
                <span class="serif fs-4 fw-bold" style="color: var(--accent);">Piccilli & Asociados <span class="fs-6 text-muted fw-normal">| Panel de Staff</span></span>
            </a>
            <a href="/panel-personal" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left me-1"></i> Volver al Panel</a>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <div class="container py-5 d-flex justify-content-center align-items-center flex-grow-1">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 shadow-sm">
                <div class="text-center mb-4">
                    <h2 class="h3" style="color: var(--accent);"><i class="bi bi-person-plus-fill me-2"></i>Registración de Cliente</h2>
                    <p class="text-secondary small">Complete los datos para dar de alta el perfil de acceso exclusivo en modo lectura.</p>
                </div>

                <form action="/registro-cliente" method="POST">
                    <div class="mb-3">
                        <label for="dni" class="form-label text-secondary small">DNI (Usuario de acceso)</label>
                        <input type="text" class="form-control" id="dni" name="dni" placeholder="Ej: 33333333" required>
                    </div>
                    <div class="mb-3">
                        <label for="nombre" class="form-label text-secondary small">Nombre</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej: Juan" required>
                    </div>
                    <div class="mb-3">
                        <label for="apellido" class="form-label text-secondary small">Apellido</label>
                        <input type="text" class="form-control" id="apellido" name="apellido" placeholder="Ej: Pérez" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label text-secondary small">Contraseña Inicial</label>
                        <input type="text" class="form-control" id="password" name="password" placeholder="Ej: 123456" required>
                    </div>
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-accent py-2">Finalizar Registro</button>
                        <a href="/panel-personal" class="btn btn-outline-secondary text-light">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
