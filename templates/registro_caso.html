<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Caso Interno - Piccilli & Asociados</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #3f3d38;
            --surface: #22262b;
            --surface-2: #2b3036;
            --border: #3d434a;
            --text: #ecebe6;
            --muted: #c2c2bc;
            --accent: #A88448;
            --accent-hover: #BA9455;
            --accent-text: #1c1a16;
            --radius: 8px;
        }
        body {
            background-color: var(--bg);   
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
        }
        h1, h2, h3, h4, h5, .serif {
            font-family: 'Cormorant Garamond', serif;
        }
        .navbar {
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
        }
        .card-custom {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        .btn-dorado-outline {
            background-color: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            font-weight: 600;
            border-radius: var(--radius);
            padding: 0.5rem 1rem;
            transition: all 0.3s ease;
        }
        .btn-dorado-outline:hover {
            background-color: var(--accent);
            color: var(--accent-text);
            border-color: var(--accent);
            transform: translateY(-1px);
        }
        .form-control, .form-select {
            background-color: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
        }
        .form-control:focus, .form-select:focus {
            background-color: var(--surface-2);
            border-color: var(--accent);
            color: var(--text);
            box-shadow: 0 0 0 0.25rem rgba(184, 152, 90, 0.25);
        }
    </style>
</head>
<body>

    <!-- Panel Superior -->
    <nav class="navbar navbar-expand-lg px-4 py-3">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-3 text-white" href="/panel-personal">
                <span class="serif fs-4 fw-bold" style="color: var(--accent);">Piccilli & Asociados <span class="fs-6 text-muted fw-normal">| Panel de Staff</span></span>
            </a>
            <a href="/perfil-cliente/{{ cliente.dni }}" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left me-1"></i> Volver al Perfil</a>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <div class="container py-5 d-flex justify-content-center align-items-center flex-grow-1">
        <div class="col-md-7 col-lg-6">
            <div class="card card-custom p-4 shadow-sm">
                <div class="text-center mb-4">
                    <h2 class="h3" style="color: var(--accent);"><i class="bi bi-journal-plus me-2"></i>Nuevo Caso Interno</h2>
                    <p class="text-secondary small mb-1">Asociado al cliente: <strong class="text-white">{{ cliente.nombre }} {{ cliente.apellido }}</strong> (DNI: {{ cliente.dni }})</p>
                    <span class="badge bg-secondary" style="font-size: 0.75rem;">El Legajo Interno se generará automáticamente</span>
                </div>

                <form action="/registro-caso/{{ cliente.dni }}" method="POST">
                    <div class="mb-3">
                        <label for="caratula" class="form-label text-secondary small">Carátula de la Causa (Obligatorio)</label>
                        <input type="text" class="form-control" id="caratula" name="caratula" placeholder="Ej: Pérez c/ Gómez s/ Daños y Perjuicios" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="nro_juzgado" class="form-label text-secondary small">Número de Juzgado (Obligatorio)</label>
                            <input type="text" class="form-control" id="nro_juzgado" name="nro_juzgado" placeholder="Ej: Juzg. Civil N° 4" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="nro_expediente_judicial" class="form-label text-secondary small">Nro. Expte. Judicial (Opcional)</label>
                            <input type="text" class="form-control" id="nro_expediente_judicial" name="nro_expediente_judicial" placeholder="Ej: 45892/2026">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="vencimiento" class="form-label text-secondary small">Fecha de Vencimiento / Plazo</label>
                            <input type="date" class="form-control" id="vencimiento" name="vencimiento" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="estado" class="form-label text-secondary small">Estado Procesal</label>
                            <select class="form-select" id="estado" name="estado">
                                <option value="En trámite" selected>En trámite</option>
                                <option value="En despacho">En despacho</option>
                                <option value="Sentencia">Sentencia</option>
                                <option value="Finalizado">Finalizado</option>
                            </select>
                        </div>
                    </div>
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-dorado-outline py-2">Guardar Caso</button>
                        <a href="/perfil-cliente/{{ cliente.dni }}" class="btn btn-outline-secondary text-light">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
